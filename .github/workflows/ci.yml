name: Checks
on:
  push:
    branches: [runtrace-dashboard, master]
  pull_request:
# A newer push to the same branch replaces a run still going for an older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'migrations/**'
              - 'config/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/ci.yml'
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Every platform a release ships for builds and passes the tests, so a release never carries untested code.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump when DuckDB's build settings change: its build script cannot unpack its sources over a cached build of
          # different settings ("Directory not empty"), so such a change needs a fresh cache.
          prefix-key: v1-duckdb-release
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
