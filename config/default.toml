[server]
host = "127.0.0.1"
port = 4310
# Exact additional Host headers for a trusted local proxy, including its public port.
# Example: ["dashboard.example.test:12443"]. Empty keeps HTTP admission localhost-only.
allowed_hosts = []
[dashboard]
timezone = "Europe/Zurich"
assets_path = "dashboard/dist"
[storage]
duckdb_path = "./data/t3-usage.duckdb"
archive_path = "./data/archive"
hot_retention_days = 30
content_retention_days = 90
zstd_level = 8
memory_limit_mb = 2048
[capture]
default_policy = "redacted_only"
store_stream_chunks = false
[source]
instance_id = "local"
display_name = "Local T3"
# Empty resolves to the current user's .t3/userdata/statev2.sqlite
sqlite_path = ""
poll_seconds = 60
collect_on_serve = true
[quota]
# Native Windows warnings at 20% and 5% left, once per window across restarts.
notifications = true
# Ask harnesses T3 does not check (Antigravity, Muse) for their limits, every 5 minutes, with their own programs.
checks = true
normal_interval_seconds = 600
near_reset_interval_seconds = 120
near_reset_window_minutes = 30
waste_threshold_percentage = 10
[mcp]
enabled = true
redacted_content_only = true
