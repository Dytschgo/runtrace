*{box-sizing:border-box;min-inline-size:0}body{margin:0;color:var(--foreground,oklch(.93 .005 70));font-family:var(--font-sans,system-ui);font-size:14px;line-height:1.5}main{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}figure{margin:0;padding:16px;border:1px solid var(--border,oklch(.3 .005 70));border-radius:var(--radius,12px);background:var(--card,oklch(.16 .005 70))}h2{font-size:16px;line-height:1.3;margin-block:0 10px}.note{color:var(--muted-foreground,oklch(.75 .005 70));font-size:12px;margin-block:10px 0}.chart{block-size:132px}.wide{grid-column:1/-1}.querychart{block-size:320px}.metric{margin-block-end:18px}.metric>strong{display:block;font-size:13px;margin-block-end:7px}.barrow{display:grid;grid-template-columns:48px minmax(0,1fr) 74px;gap:8px;align-items:center;font-size:12px;margin-block:5px}.barrow b{font:inherit;text-align:end;font-variant-numeric:tabular-nums}.track{block-size:13px;background:var(--secondary,oklch(.23 .005 70));border-radius:3px;overflow:clip}.track i{display:block;block-size:100%;border-radius:3px}.before{background:var(--muted-foreground,oklch(.65 .005 70))}.after{background:var(--chart-1,oklch(.75 .16 55))}figcaption{font-size:12px;color:var(--muted-foreground,oklch(.75 .005 70))}.standout{font-size:clamp(20px,5vw,30px);font-weight:650;letter-spacing:-.03em;margin-block:10px 4px}
</style></head><body><main>
<figure aria-label="Unchanged historical import measured duration"><h2>Unchanged import</h2><div class="standout">0.329 seconds</div><div class="chart"><div class="metric"><strong>Same frozen 112-thread source</strong><div class="barrow"><span>Before</span><div class="track"><i class="before" style="inline-size:94.78333333333333%"></i></div><b>56.87 s</b></div><div class="barrow"><span>Current</span><div class="track"><i class="after" style="inline-size:0.5483333333333335%"></i></div><b>0.329 s</b></div></div></div><figcaption>Original debug repeat mean versus improved release repeat. Two unchanged repeats each; changed = 0. Build optimisation is included in this comparison.</figcaption></figure>
<figure aria-label="Lossless archive compression"><h2>Lossless compression</h2><div class="standout">4.02 MB</div><div class="chart"><div class="metric"><strong>Same 5,950 normalized records</strong><div class="barrow"><span>Before</span><div class="track"><i class="before" style="inline-size:93.24999999999999%"></i></div><b>37.3 MB</b></div><div class="barrow"><span>Current</span><div class="track"><i class="after" style="inline-size:10.049999999999999%"></i></div><b>4.02 MB</b></div></div></div><figcaption>Uncompressed Parquet versus Zstd 8 / 2,048-row groups. Every restored field matched. Retrieval median: 22.85 ms with Zstd, 31.16 ms uncompressed.</figcaption></figure>
<figure class="wide" aria-label="Production query median durations before and after retained query changes"><h2>Production query medians · milliseconds</h2><div class="querychart"><div class="metric"><strong>100 tool calls</strong><div class="barrow"><span>Before</span><div class="track"><i class="before" style="inline-size:91.57142857142857%"></i></div><b>641 ms</b></div><div class="barrow"><span>Current</span><div class="track"><i class="after" style="inline-size:37.714285714285715%"></i></div><b>264 ms</b></div></div><div class="metric"><strong>500 tool calls · offset 1,500</strong><div class="barrow"><span>Before</span><div class="track"><i class="before" style="inline-size:86.71428571428571%"></i></div><b>607 ms</b></div><div class="barrow"><span>Current</span><div class="track"><i class="after" style="inline-size:61.285714285714285%"></i></div><b>429 ms</b></div></div><div class="metric"><strong>Full-content search · 25 results</strong><div class="barrow"><span>Before</span><div class="track"><i class="before" style="inline-size:93.56521739130434%"></i></div><b>2,152 ms</b></div><div class="barrow"><span>Current</span><div class="track"><i class="after" style="inline-size:69.47826086956522%"></i></div><b>1,598 ms</b></div></div></div><figcaption>Same paused 127,537-record database, release build, 512 MB DuckDB budget; five sequential HTTP samples each. Each row has its own scale. Six response digests stayed identical. Search remains above the one-second target.</figcaption></figure>
