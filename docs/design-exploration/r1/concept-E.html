function update(){const t=total(lo,hi);targets={total:t};statDefs.forEach(([k])=>targets[k]=sum(lo,hi,k));if(dragging||reduce.matches){Object.keys(targets).forEach(k=>{values[k]=targets[k];$('#'+k).textContent=compact(targets[k])})}else if(!raf){last=0;raf=requestAnimationFrame(count)}const left=x(lo),right=x(hi);$('#selection').setAttribute('x',lo===0?0:left);$('#selection').setAttribute('width',(hi===34?1440:right)-(lo===0?0:left));$$('.handle').forEach((h,i)=>{let v=i?hi:lo;h.style.insetInlineStart=x(v)+'px';h.setAttribute('aria-valuenow',v);h.setAttribute('aria-valuetext',date(v));h.setAttribute('aria-valuemin',i?lo:0);h.setAttribute('aria-valuemax',i?34:hi);h.querySelector('.handle-date').textContent=date(v)});$$('#ticks span').forEach((e,j)=>{const tx=x([0,7,14,21,28,34][j]);e.style.visibility=Math.abs(tx-left)<75||Math.abs(tx-right)<75?'hidden':'visible'});$('#hero-range').textContent=date(lo)+' — '+date(hi)+' 2026';$('#window-size').textContent=(hi-lo+1)+' days';$('#peak').textContent='↑ '+compact(Math.max(...RT.days.slice(lo,hi+1).map(tokenDay)))+' peak';$$('.model').forEach((b,i)=>{const m=RT.models[i];if(m.tokens===null){b.dataset.tip=m.id+' · no usage reported';return}const n=sum(lo,hi,m.id),p=t?100*n/t:0;b.querySelector('.share').textContent=p>0&&p<.1?'<0.1%':p.toFixed(1)+'%';b.dataset.tip=m.id+' · '+n.toLocaleString('en')+' tokens · '+p.toFixed(2)+'%'})}
const set=(index,v)=>{v=Math.round(v);if(index)hi=Math.max(lo,Math.min(34,v));else lo=Math.max(0,Math.min(hi,v));update()};
$$('.handle').forEach((h,i)=>{h.addEventListener('keydown',e=>{let v=i?hi:lo,step=e.shiftKey?7:1;if(['ArrowRight','ArrowUp','ArrowLeft','ArrowDown','Home','End','PageUp','PageDown'].includes(e.key)){e.preventDefault();set(i,e.key==='Home'?0:e.key==='End'?34:v+(e.key==='PageUp'?7:e.key==='PageDown'?-7:['ArrowRight','ArrowUp'].includes(e.key)?step:-step))}});h.addEventListener('pointerdown',e=>{dragging=true;h.setPointerCapture(e.pointerId);h.focus();e.preventDefault()});h.addEventListener('pointermove',e=>{if(dragging&&h.hasPointerCapture(e.pointerId))set(i,(e.clientX-100)/1240*34)});h.addEventListener('pointerup',()=>{dragging=false});h.addEventListener('pointercancel',()=>{dragging=false})});
$('#reset').onclick=()=>{lo=0;hi=34;update()};
function motion(){document.body.classList.toggle('paused',paused||document.hidden);$('#motion').setAttribute('aria-label',paused?'Play current':'Pause current');$('#motion').title=paused?'Play ambient current':'Pause ambient current';$('#motion').innerHTML=icon(paused?'play':'pause')}
$('#motion').onclick=()=>{paused=!paused;motion()};document.addEventListener('visibilitychange',()=>{motion();if(document.hidden){cancelAnimationFrame(raf);raf=0}else{last=0;raf=requestAnimationFrame(count)}});
const tip=$('.tooltip');document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el){tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect();tip.style.insetInlineStart=Math.max(12,Math.min(1100,r.x))+'px';tip.style.insetBlockStart=(r.y>700?r.y-48:r.bottom+12)+'px'}});document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))tip.hidden=true});document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el){tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect();tip.style.insetInlineStart=Math.min(1100,r.x)+'px';tip.style.insetBlockStart=(r.y>700?r.y-48:r.bottom+12)+'px'}});document.addEventListener('focusout',()=>tip.hidden=true);document.addEventListener('keydown',e=>{if(e.key==='Escape')tip.hidden=true});update();
</script></body></html>
