  tube.className = 'tube';
  const ink = document.createElement('div');
  ink.className = 'ink';
  tube.style.blockSize = (dayTotal(row) / maxDay * 100) + '%';
  ink.style.animationDelay = (i * 14) + 'ms';
  const parts = [];
  if (row[ix.otherModelTokens] > 0) parts.push(['other', row[ix.otherModelTokens]]);
  for (const m of RT.models) {
    if (m.tokens == null) continue;
    const v = row[ix[m.id]];
    if (v > 0) parts.push([m.id, v]);
  }
  for (const [id, v] of parts) {
    const seg = document.createElement('i');
    seg.className = 'seg' + (id === 'other' ? ' other' : '');
    if (id !== 'other') seg.dataset.model = id;
    seg.style.setProperty('--v', v);
    seg.style.setProperty('--c', id === 'other' ? '#B08968' : COLOR[id]);
    seg.title = (id === 'other' ? 'Other models' : id) + ' · ' + fmt(v);
    ink.appendChild(seg);
  }
  tube.appendChild(ink);
  rod.appendChild(tube);
  rodsEl.appendChild(rod);
  return rod;
});

const modelsEl = document.getElementById('models');
const bars = [];
function addRow(id, icon, miss, other) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'mrow' + (miss ? ' miss' : '') + (other ? ' other-row other' : '');
  b.style.setProperty('--c', other ? '#B08968' : COLOR[id]);
  b.style.setProperty('--i', bars.length);
  if (!other) b.dataset.model = id;
  const jewel = document.createElement('span');
  jewel.className = 'jewel';
  jewel.setAttribute('aria-hidden', 'true');
  if (icon) jewel.innerHTML = ico(icon);
  const name = document.createElement('span');
  name.className = 'mname';
  name.textContent = id;
  const pc = document.createElement('span');
  pc.className = 'mpct num';
  pc.textContent = miss ? '–' : '';
  const meter = document.createElement('span');
  meter.className = 'meter' + (miss ? ' hatch' : '');
  const fill = document.createElement('i');
  if (!miss) meter.appendChild(fill);
  b.append(jewel, name, pc, meter);
  b.title = miss ? 'no usage reported' : id;
  if (miss) b.setAttribute('aria-label', id + ', no usage reported');
  modelsEl.appendChild(b);
  bars.push({ id, pc, fill, miss, other, el: b });
}
for (const m of RT.models) addRow(m.id, m.icon, m.tokens == null, false);
addRow('Other', '', false, true);

const heat = document.getElementById('heat');
const cells = document.createElement('div');
cells.className = 'cells';
const dows = document.createElement('div');
dows.className = 'dows';
const hrs = document.createElement('div');
hrs.className = 'hrs';
const hmax = Math.max(...RT.heatmap.prompts.flat());
RT.heatmap.rows.forEach((name, r) => {
  const s = document.createElement('span');
  s.textContent = name[0];
  s.title = name;
  dows.appendChild(s);
  RT.heatmap.prompts[r].forEach((v, h) => {
    const c = document.createElement('i');
    c.className = 'cell';
    const t = v ? Math.sqrt(v / hmax) : 0;
    c.style.background = v ? `oklch(${(90 - t * 48).toFixed(1)}% ${(0.02 + t * 0.14).toFixed(3)} ${(46 - t * 16).toFixed(0)})` : 'oklch(0.91 0.012 82)';
    c.title = name + ' ' + String(h).padStart(2, '0') + ':00 · ' + v;
    cells.appendChild(c);
  });
});
for (let h = 0; h < 24; h++) {
  const s = document.createElement('span');
  if (h % 6 === 0) s.textContent = String(h);
  hrs.appendChild(s);
}
heat.append(dows, cells, hrs);

const TICO = { command_execution: 'terminal', file_change: 'file-pen', Read: 'file-text', 't3-code.preview_evaluate': 'scan', 't3-code.preview_snapshot': 'camera', 't3-code.t3_thread_read': 'message-square' };
const toolsEl = document.getElementById('tools');
for (const t of RT.tools) {
  const row = document.createElement('div');
  row.className = 'trow';
  row.setAttribute('role', 'img');
  const fail = t.calls ? (t.failed / t.calls * 100) : 0;
  row.setAttribute('aria-label', t.name + ', ' + fmt(t.calls) + ' calls, ' + fail.toFixed(1) + '% failed');
  row.innerHTML = `<span class="ic">${ico(TICO[t.name])}</span><b class="num">${fmt(t.calls)}</b><em class="num" title="Failure share">${fail.toFixed(1)}%</em>`;
  toolsEl.appendChild(row);
}

const tokEl = document.getElementById('tok');
const outs = {
  prompts: document.getElementById('n-prompts'),
  providerTurns: document.getElementById('n-turns'),
  threads: document.getElementById('n-threads'),
  subAgents: document.getElementById('n-agents'),
  toolCalls: document.getElementById('n-calls')
};
const d0 = document.getElementById('d0');
const d1 = document.getElementById('d1');
const groove = document.getElementById('groove');
const fill = document.getElementById('fill');
const b0 = document.getElementById('b0');
const b1 = document.getElementById('b1');
b0.setAttribute('aria-valuemax', last);
b1.setAttribute('aria-valuemax', last);

function paintBeads() {
  const travel = Math.max(1, groove.clientWidth - 44);
  const x0 = vis[0] * travel, x1 = vis[1] * travel;
  b0.style.transform = `translateX(${x0}px)`;
  b1.style.transform = `translateX(${x1}px)`;
  fill.style.transform = `translateX(${x0 + 22}px)`;
  fill.style.width = Math.max(0, x1 - x0) + 'px';
}
function springStep() {
  if (document.hidden || dragging !== null) { if (looping) requestAnimationFrame(springStep); return; }
  let live = false;
  for (let i = 0; i < 2; i++) {
    const d = goal[i] - vis[i];
    vel[i] = vel[i] * 0.64 + d * 0.2;
    vis[i] += vel[i];
    if (Math.abs(d) > 0.0008 || Math.abs(vel[i]) > 0.0008) live = true;
    else { vis[i] = goal[i]; vel[i] = 0; }
  }
  paintBeads();
  if (live) requestAnimationFrame(springStep);
  else looping = false;
}
function setGoal() {
  goal[0] = A / last; goal[1] = B / last;
  if (reduce || dragging !== null) { vis[0] = goal[0]; vis[1] = goal[1]; vel = [0, 0]; paintBeads(); return; }
  if (!looping) { looping = true; requestAnimationFrame(springStep); }
}
function writeNums(s, animate) {
  const pairs = [[tokEl, s.total], [outs.prompts, s.prompts], [outs.providerTurns, s.providerTurns], [outs.threads, s.threads], [outs.subAgents, s.subAgents], [outs.toolCalls, s.toolCalls]];
  countGen++;
  const gen = countGen;
  if (!animate || reduce) { pairs.forEach(([el, v]) => { el.textContent = fmt(v); }); return; }
  const t0 = performance.now();
  let paused = 0, prev = t0;
  const units = pairs.map(([, v]) => v >= 1e9 ? 1e9 : v >= 1e6 ? 1e6 : v >= 1e3 ? 1e3 : 1);
  function frame(now) {
    if (gen !== countGen) return;
    if (document.hidden) { paused += now - prev; prev = now; requestAnimationFrame(frame); return; }
    prev = now;
    const k = Math.min(1, (now - t0 - paused) / 880);
    const e = 1 - (1 - k) ** 3;
    pairs.forEach(([el, v], i) => {
      const u = units[i];
      const shown = v * e;
      el.textContent = u === 1 ? String(Math.round(shown)) : (shown / u).toFixed(1) + (u === 1e9 ? 'B' : u === 1e6 ? 'M' : 'K');
    });
    if (k < 1) requestAnimationFrame(frame);
    else pairs.forEach(([el, v]) => { el.textContent = fmt(v); });
  }
  requestAnimationFrame(frame);
}
let booted = false;
function render(animate) {
  const s = sum(A, B);
  writeNums(s, animate && !booted);
  booted = true;
  rodNodes.forEach((rod, i) => rod.classList.toggle('out', i < A || i > B));
  for (const row of bars) {
    if (row.miss) continue;
    const part = row.other ? s.other : s.tok[row.id];
    const text = pct(part, s.total);
    row.pc.textContent = text;
    row.fill.style.inlineSize = (s.total ? part / s.total * 100 : 0) + '%';
    if (!row.other) row.el.setAttribute('aria-label', row.id + ', ' + text + ' of tokens');
    else row.el.title = 'Other model tokens';
  }
  d0.textContent = short(RT.days[A][0]);
  d1.textContent = short(RT.days[B][0]);
  b0.setAttribute('aria-valuenow', A);
  b1.setAttribute('aria-valuenow', B);
  b0.setAttribute('aria-valuetext', RT.days[A][0]);
  b1.setAttribute('aria-valuetext', RT.days[B][0]);
  if (dragging === null) setGoal();
  else paintBeads();
}
function hi(id) {
  const on = !!id;
  document.querySelectorAll('.mrow, .seg').forEach((el) => {
    const m = el.dataset.model || (el.classList.contains('other') ? 'other' : '');
    el.classList.toggle('dim', on && m !== id);
    el.classList.toggle('hot', on && !!m && m === id);
  });
}
document.addEventListener('pointerover', (e) => {
  const row = e.target.closest('.mrow');
  if (row) { hi(row.dataset.model || (row.classList.contains('other') ? 'other' : '')); return; }
  const seg = e.target.closest('.seg');
  if (seg) hi(seg.dataset.model || (seg.classList.contains('other') ? 'other' : ''));
});
document.addEventListener('pointerout', (e) => {
  if (!e.target.closest('.mrow, .seg')) return;
  const rel = e.relatedTarget;
  if (rel && rel.closest && rel.closest('.mrow, .seg')) return;
  hi('');
});
document.addEventListener('focusin', (e) => {
  const row = e.target.closest('.mrow');
  if (row) hi(row.dataset.model || (row.classList.contains('other') ? 'other' : ''));
});
document.addEventListener('focusout', (e) => {
  const rel = e.relatedTarget;
  if (!rel || !rel.closest || !rel.closest('.mrow')) hi('');
});

function tFrom(e) {
  const r = groove.getBoundingClientRect();
  const travel = Math.max(1, r.width - 44);
  return Math.max(0, Math.min(1, (e.clientX - r.left - 22) / travel));
}
function moveDrag(e) {
  let t = tFrom(e);
  if (dragging === 0) {
    t = Math.min(t, B / last);
    vis[0] = t; vel[0] = 0;
    const next = Math.min(B, Math.round(t * last));
    if (next !== A) { A = next; render(false); }
  } else {
    t = Math.max(t, A / last);
    vis[1] = t; vel[1] = 0;
    const next = Math.max(A, Math.round(t * last));
    if (next !== B) { B = next; render(false); }
  }
  paintBeads();
  b0.style.zIndex = dragging === 0 ? 3 : 1;
  b1.style.zIndex = dragging === 1 ? 3 : 2;
}
function down(which, e) {
  dragging = which;
  document.documentElement.classList.add('drag');
  (which ? b1 : b0).setPointerCapture(e.pointerId);
  moveDrag(e);
  e.preventDefault();
}
b0.addEventListener('pointerdown', (e) => down(0, e));
b1.addEventListener('pointerdown', (e) => down(1, e));
groove.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.bead')) return;
  const t = tFrom(e);
  down(Math.abs(t - A / last) <= Math.abs(t - B / last) ? 0 : 1, e);
});
function up() {
  if (dragging === null) return;
  dragging = null;
  document.documentElement.classList.remove('drag');
  setGoal();
}
b0.addEventListener('pointerup', up);
b1.addEventListener('pointerup', up);
b0.addEventListener('pointermove', (e) => { if (dragging !== null) moveDrag(e); });
b1.addEventListener('pointermove', (e) => { if (dragging !== null) moveDrag(e); });
groove.addEventListener('pointerup', up);
groove.addEventListener('pointermove', (e) => { if (dragging !== null) moveDrag(e); });
function onKey(which, e) {
  let dir = 0;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') dir = 1;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') dir = -1;
  if (e.key === 'Home') dir = -999;
  if (e.key === 'End') dir = 999;
  if (!dir) return;
  e.preventDefault();
  const step = e.shiftKey ? 7 : 1;
  if (which === 0) {
    if (dir === -999) A = 0;
    else if (dir === 999) A = B;
    else A = Math.max(0, Math.min(B, A + dir * step));
  } else if (dir === -999) B = A;
  else if (dir === 999) B = last;
  else B = Math.max(A, Math.min(last, B + dir * step));
  render(false);
}
b0.addEventListener('keydown', (e) => onKey(0, e));
b1.addEventListener('keydown', (e) => onKey(1, e));
document.addEventListener('visibilitychange', () => {
  document.documentElement.toggleAttribute('data-paused', document.hidden);
});
document.fonts.ready.then(paintBeads);
render(true);
</script>
</body>
</html>
