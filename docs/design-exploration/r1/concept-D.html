<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runtrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;min-width:0}
:root{
  --bg:oklch(0% 0 none);
  --surface:oklch(14% 0 none);
  --line:oklch(1 0 none / 0.16);
  --text:oklch(96% 0 none);
  --dim:oklch(78% 0 none);
  --unlit:oklch(32% 0 none);
  --phosphor:oklch(96.5% 0.012 95);
  --fail:oklch(68.9% 0.2 29.7);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --dot:34px;
  --gap:7px;
}
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--text)}
body{
  font-family:"Martian Mono",ui-monospace,monospace;
  font-size:12px;
  font-weight:400;
  font-synthesis:none;
  -webkit-font-smoothing:antialiased;
  display:grid;
  grid-template-columns:64px 286px minmax(0,1fr);
  grid-template-rows:86px minmax(0,1fr) 176px 118px 116px;
  color-scheme:dark;
}
svg{display:block}
button{font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none}
:focus-visible{outline:2px solid var(--phosphor);outline-offset:2px}
.ic{width:1.25em;height:1.25em;max-width:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

nav{grid-column:1;grid-row:1 / -1;display:flex;flex-direction:column;padding-block:6px;padding-inline:6px;border-inline-end:1px solid var(--line);anchor-scope:--nav;position:relative}
nav button{flex:1;display:grid;place-items:center;position:relative;color:var(--dim);font-size:22px}
nav button[aria-current="page"]{color:var(--text);anchor-name:--nav}
nav::before{content:"";position:absolute;position-anchor:--nav;inset-inline-start:0;inset-block-start:anchor(top);inline-size:2px;block-size:anchor-size(height);background:var(--phosphor)}
.tip{position:absolute;opacity:0;pointer-events:none;white-space:nowrap;background:oklch(16% 0 none);color:var(--text);border:1px solid var(--line);padding:4px 8px;font-size:12px;z-index:6;font-weight:400;letter-spacing:0}
nav .tip{inset-inline-start:calc(100% + 8px);inset-block-start:50%;translate:0 -50%}

header{grid-column:2 / -1;grid-row:1;display:flex;align-items:center;gap:16px;padding-inline:18px 20px;border-block-end:1px solid var(--line)}
.lockup{display:flex;align-items:center;gap:12px}
.mark{width:30px;height:42px;max-width:none}
.ld{fill:var(--phosphor);opacity:1}
.word{font-family:Doto,sans-serif;font-weight:500;font-size:28px;letter-spacing:0.04em;line-height:1}
.hero{margin-inline-start:auto;display:flex;align-items:end;gap:14px}
.tz,.unit{color:var(--dim);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding-bottom:6px}
.digits{display:flex;font-family:Doto,sans-serif;font-weight:700;font-size:56px;line-height:0.8;font-variant-numeric:tabular-nums}
.digits i{display:block;width:0.58em;text-align:center;font-style:normal}

.models{grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:space-evenly;padding:8px 14px;border-inline-end:1px solid var(--line);min-height:0}
.mrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;row-gap:3px;align-items:center;text-align:start;color:var(--text);inline-size:100%}
.mrow .ibox{grid-column:1;grid-row:1 / span 2;display:grid;place-items:center;width:18px;height:18px;color:var(--c);font-size:15px}
.mrow.miss .ibox{background:repeating-linear-gradient(-45deg,var(--c) 0 1px,transparent 1px 4px)}
.nm{grid-column:2;grid-row:1;font-size:12px;white-space:nowrap;line-height:1.2}
.meter{grid-column:2;grid-row:2;display:flex;gap:2px;align-items:center;block-size:8px}
.pct{grid-column:3;grid-row:1 / span 2;font-size:12px;color:var(--c);font-variant-numeric:tabular-nums;font-weight:500}
.pip{width:6px;height:6px;border-radius:50%;background:var(--unlit);flex:none}
.pip.on{background:var(--c);box-shadow:0 0 4px color-mix(in oklch,var(--c) 70%,transparent)}
.hatchbar{width:64px;height:8px;background:repeating-linear-gradient(-45deg,var(--c) 0 1.5px,transparent 1.5px 5px)}
.ring{width:12px;height:12px;border:1.5px solid var(--c);border-radius:50%;justify-self:center}

.heat{grid-column:3;grid-row:2;position:relative;display:grid;place-items:center;padding:16px 18px;min-height:0}
.all{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim)}
.heat>.all{position:absolute;inset-block-start:14px;inset-inline-end:18px}
.hframe{display:grid;grid-template-columns:16px auto;grid-template-rows:16px auto;gap:6px;align-items:center}
.hours{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(24,var(--dot));gap:var(--gap);padding-inline:8px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.hours span{text-align:center}
.ydays{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(7,var(--dot));gap:var(--gap);padding-block:8px;color:var(--dim);font-size:12px;align-items:center;justify-items:center}
.cells{grid-column:2;grid-row:2;position:relative;display:grid;grid-template-columns:repeat(24,var(--dot));grid-template-rows:repeat(7,var(--dot));gap:var(--gap);padding:8px;border:1px solid var(--line);background:var(--surface)}
.hdot{width:100%;height:100%;border-radius:50%;background:var(--phosphor);opacity:0.12}

.days{grid-column:2 / -1;grid-row:3;position:relative;padding:14px 16px;border-block-start:1px solid var(--line);min-height:0}
.cols{block-size:100%;display:grid;grid-template-columns:repeat(35,1fr);border:1px solid var(--line);background:var(--surface)}
.day{display:grid;grid-template-rows:repeat(10,1fr);justify-items:center;align-items:center;min-height:0}
.dot{width:11px;height:11px;border-radius:50%;background:var(--unlit);opacity:0.14}
.dot.on{background:var(--c);opacity:1;box-shadow:0 0 5px color-mix(in oklch,var(--c) 65%,transparent)}
.dot.ghost{background:var(--c);opacity:0.16;box-shadow:none}

.bridge{grid-column:2 / -1;grid-row:4;display:grid;grid-template-columns:1.2fr 0.8fr;border-block-start:1px solid var(--line);min-height:0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding-inline:16px;gap:8px}
.stat{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;font-size:16px}
.stat .ic{grid-row:1 / span 2;color:var(--dim)}
.stat .digits{grid-column:2;grid-row:1;font-size:26px;justify-content:flex-start}
.lbl{grid-column:2;grid-row:2;color:var(--dim);font-size:12px;letter-spacing:0.08em;text-transform:uppercase}
.tools{position:relative;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 16px}
.tools .all{align-self:end}
.tgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tool{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;row-gap:4px;align-items:center;color:var(--text);text-align:start;font-size:14px}
.tool .ic{grid-row:1 / span 2;color:var(--dim)}
.tnum{grid-column:2;grid-row:1;font-size:12px;font-variant-numeric:tabular-nums;font-weight:500}
.fmeter{grid-column:2;grid-row:2;display:flex;gap:2px;align-items:center}
.fp{width:4px;height:4px;border-radius:50%;background:oklch(62% 0 none);flex:none}
.fp.bad{background:var(--fail);box-shadow:0 0 4px color-mix(in oklch,var(--fail) 70%,transparent)}
.tools .tip{inset-inline-start:0;inset-block-end:calc(100% + 6px)}.tool:nth-last-child(-n+3) .tip{inset-inline-start:auto;inset-inline-end:0}

.seq{grid-column:2 / -1;grid-row:5;padding:8px 16px 12px;border-block-start:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-height:0}
.seq-meta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#wlen{color:var(--text)}
.track{position:relative;flex:1;border:1px solid var(--line);background:var(--surface);min-height:0}
.sgrid{position:relative;display:grid;grid-template-columns:repeat(35,1fr);block-size:100%}
.scell{display:grid;place-items:center;border-inline-end:1px solid oklch(1 0 none / 0.1);position:relative;z-index:1}
.scell:last-child{border-inline-end:0}
.scell.in{background:oklch(1 0 none / 0.06)}
.lamp{width:16px;height:16px;border-radius:50%;background:var(--c);opacity:calc(var(--in,0.22) * var(--b,0.4));box-shadow:0 0 6px color-mix(in oklch,var(--c) 55%,transparent)}
.lamp.ghost{--in:0.28}
.lamp.on{--in:1}
.band{position:absolute;z-index:2;inset-block:0;background:transparent;box-shadow:inset 0 2px 0 var(--phosphor),inset 0 -2px 0 var(--phosphor);pointer-events:none}
.handle{position:absolute;z-index:3;inline-size:14px;inset-block:0;background:transparent;cursor:ew-resize;touch-action:none}
.handle::before{content:"";position:absolute;inset-block:12px;inset-inline-start:2px;inline-size:8px;background:var(--phosphor);box-shadow:0 0 8px oklch(1 0 none / 0.9)}
#hb{translate:-100% 0}
#hb::before{inset-inline-start:auto;inset-inline-end:2px}
.handle::after{content:"";position:absolute;inset-block:min(0px,calc((100% - 44px) / 2));inset-inline:-16px}
.sweep{position:absolute;inset-block:0;inset-inline-start:0;inline-size:10%;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,oklch(1 0 none / 0.45),transparent);z-index:4}

body[data-hi] .mrow.dim{opacity:0.28}
body[data-hi] .mrow.hot{opacity:1}
body[data-hi] .dot.dim{opacity:0.08;box-shadow:none}
body[data-hi] .dot.hot.on{opacity:1;box-shadow:0 0 5px color-mix(in oklch,var(--c) 65%,transparent)}
body[data-hi] .lamp.dim{opacity:calc(0.16 * var(--b,.4));box-shadow:none}
body[data-hi] .lamp.hot.on{opacity:var(--b,.4);box-shadow:0 0 6px color-mix(in oklch,var(--c) 55%,transparent)}

@media(hover:hover) and (pointer:fine){
  nav button:hover{color:var(--text)}
  .mrow:hover,.tool:hover{background:oklch(1 0 none / 0.04)}
  nav button:hover .tip,.tool:hover .tip{opacity:1}
}
button:focus-visible .tip{opacity:1}
button:active{background:oklch(1 0 none / 0.08)}

@media(prefers-reduced-motion:no-preference){
  nav::before{transition:inset-block-start .28s var(--ease-out),block-size .28s var(--ease-out)}
  button{transition:scale 160ms var(--ease-out),background-color 160ms var(--ease-out),opacity 160ms var(--ease-out),color 160ms var(--ease-out)}
  button:active{scale:0.98}
  .ld{animation:led .38s var(--ease-out) both;animation-delay:calc(var(--i) * 42ms)}
  header{animation:rise .5s var(--ease-out) both}
  .models{animation:rise .5s .08s var(--ease-out) both}
  .heat{animation:rise .55s .12s var(--ease-out) both}
  .days{animation:rise .5s .2s var(--ease-out) both}
  .bridge{animation:rise .5s .28s var(--ease-out) both}
  .seq{animation:rise .5s .34s var(--ease-out) both}
  .dot,.lamp,.pip,.mrow,.hdot{transition:opacity 140ms var(--ease-out),background-color 140ms var(--ease-out)}
  .intro .hdot{transition-duration:480ms;transition-delay:calc(var(--x) * 16ms + var(--y) * 22ms)}
  .wave .day .dot,.wave .scell .lamp{transition-delay:calc(var(--x) * 8ms)}
  .wave .sweep{animation:scan .6s var(--ease-out)}
  .cells::before,.cells::after{content:"";position:absolute;inset-inline:0;block-size:3px;pointer-events:none;z-index:2;background:linear-gradient(90deg,transparent calc(var(--scan) - 1.6%),var(--phosphor) var(--scan),transparent calc(var(--scan) + 1.6%));animation:sweep 7.5s linear 1.2s infinite}
  .cells::before{inset-block-start:0}
  .cells::after{inset-block-end:0}
  html.away .cells::before,html.away .cells::after{animation-play-state:paused}
}
@keyframes led{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
@property --scan{syntax:"<percentage>";inherits:false;initial-value:0%}
@keyframes sweep{from{--scan:0%}to{--scan:100%}}
@keyframes scan{0%{opacity:.95;translate:0 0}100%{opacity:0;translate:900% 0}}
</style>
</head>

function icon(n){return `<svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;}
function el(tag,cls,parent){const n=document.createElement(tag);if(cls)n.className=cls;if(parent)parent.append(n);return n;}
function fmt(n){n=Math.max(0,n);if(n>=1e9)return (n/1e9).toFixed(1)+"B";if(n>=1e6)return (n/1e6).toFixed(1)+"M";if(n>=1e5)return Math.round(n/1e3)+"K";if(n>=1e3)return (n/1e3).toFixed(1)+"K";return String(Math.round(n));}
function pct(part,total){if(!(total>0))return "0%";const p=100*part/total;if(p<=0)return "0%";if(p<0.1)return "<0.1%";return p.toFixed(1)+"%";}
function dlab(i){return RT.days[i][0].slice(5).replace("-",".");}
function rowTok(row){let t=row[COL.otherModelTokens];for(const m of measured)t+=row[COL[m.id]];return t;}
function win(key){let s=0;for(let i=a;i<=b;i++)s+=RT.days[i][COL[key]];return s;}
function winModel(id){let s=0;for(let i=a;i<=b;i++)s+=RT.days[i][COL[id]];return s;}
function winTok(){let s=0;for(let i=a;i<=b;i++)s+=rowTok(RT.days[i]);return s;}

const nav=document.getElementById("nav");
NAV.forEach(([n,label],i)=>{
  const b=el("button");b.type="button";b.setAttribute("aria-label",label);if(i===0)b.setAttribute("aria-current","page");
  b.innerHTML=icon(n)+`<span class="tip">${label}</span>`;
  b.addEventListener("click",()=>{nav.querySelectorAll("button").forEach(x=>x.removeAttribute("aria-current"));b.setAttribute("aria-current","page");});
  nav.append(b);
});

function slots(node,count){node.textContent="";for(let i=0;i<count;i++)node.append(document.createElement("i"));}
function setDigits(node,str,end){const cells=node.children;const s=(end?String(str).padEnd(cells.length," "):String(str).padStart(cells.length," "));for(let i=0;i<cells.length;i++)cells[i].textContent=s[i]===" "?"":s[i];}
const tokEl=document.getElementById("tok");slots(tokEl,6);
const statEls={};
const stats=document.getElementById("stats");
STATS.forEach(([ic,key,word,full])=>{
  const s=el("div","stat",stats);s.setAttribute("aria-label",full);s.innerHTML=icon(ic);
  const d=el("b","digits",s);d.dataset.readout="";slots(d,5);statEls[key]=d;
  const l=el("span","lbl",s);l.textContent=word;
});

const rows=[];
function addRow(id,miss){
  const b=el("button","mrow"+(miss?" miss":""),document.getElementById("models"));
  b.type="button";b.dataset.model=id;b.style.setProperty("--c",C[id]);
  const box=el("span","ibox",b);box.innerHTML=id==="other"?`<span class="ring"></span>`:icon(RT.models.find(m=>m.id===id).icon);
  const nm=el("span","nm",b);nm.textContent=id==="other"?"other":id;
  const meter=el("span","meter",b);
  const pips=[];
  if(miss){meter.append(el("span","hatchbar"));b.title="no usage reported";}
  else{for(let i=0;i<PIPS;i++)pips.push(el("i","pip",meter));}
  const pc=miss?null:el("span","pct",b);
  b.addEventListener("pointerenter",()=>setHi(id));
  b.addEventListener("pointerleave",()=>{if(document.activeElement!==b)setHi("");});
  b.addEventListener("focus",()=>setHi(id));
  b.addEventListener("blur",()=>setHi(""));
  rows.push({id,miss,pips,pc,b});
}
measured.forEach((m,i)=>{if(i===4)addRow("other",false);addRow(m.id,false);});
missing.forEach(m=>addRow(m.id,true));

const hours=document.getElementById("hours"),ydays=document.getElementById("ydays"),heat=document.getElementById("heat");
for(let h=0;h<24;h++){const s=el("span","",hours);if(h%6===0)s.textContent=String(h);}
RT.heatmap.rows.forEach(r=>{const s=el("span","",ydays);s.textContent=r[0];s.title=r;});
const hm=RT.heatmap.prompts,hmMax=Math.max(...hm.flat());
const hdots=[];
hm.forEach((row,y)=>{row.forEach((v,x)=>{
  const d=el("i","hdot",heat);d.style.setProperty("--x",x);d.style.setProperty("--y",y);d.title=`${RT.heatmap.rows[y]} ${x}:00, ${v} prompts`;
  const level=v?Math.pow(v/hmMax,0.55):0;
  hdots.push([d,v?0.2+0.8*level:0.08,level]);
});});
function lightHeat(){for(const [d,o,g] of hdots){d.style.opacity=o;if(g>0.55)d.style.boxShadow=`0 0 ${4+g*8}px color-mix(in oklch, var(--phosphor) ${Math.round(40+g*40)}%, transparent)`;}}

const maxDay=Math.max(...RT.days.map(rowTok));
const maxP=Math.max(...RT.days.map(r=>r[COL.prompts]));
const cols=document.getElementById("cols");
const dayCols=[];
RT.days.forEach((row,i)=>{
  const total=rowTok(row);
  const height=total<=0?0:Math.max(1,Math.round(SLOTS*total/maxDay));
  const map={other:row[COL.otherModelTokens]};
  for(const m of measured)map[m.id]=row[COL[m.id]];
  const raw=STACK.map(id=>{const v=map[id]||0;const exact=total?v/total*height:0;return {id,v,n:Math.floor(exact),frac:exact-Math.floor(exact)};});
  let used=raw.reduce((s,p)=>s+p.n,0);
  raw.map((p,idx)=>idx).sort((i,j)=>raw[j].frac-raw[i].frac).forEach(idx=>{if(used<height&&raw[idx].v>0){raw[idx].n++;used++;}});
  const lit=[];raw.forEach(p=>{for(let k=0;k<p.n;k++)lit.push(p.id);});
  const top=[...Array(SLOTS-lit.length).fill(null),...lit.slice().reverse()];
  const col=el("div","day",cols);col.style.setProperty("--x",i);col.title=`${row[0]}: ${fmt(total)} tokens`;
  const dots=top.map(id=>{
    const d=el("i",id?"dot":"dot",col);
    if(id){d.dataset.model=id;d.style.setProperty("--c",C[id]);}
    return d;
  });
  let dom="other",best=map.other||0;
  for(const m of measured)if((map[m.id]||0)>best){best=map[m.id];dom=m.id;}
  dayCols.push({dots,lit:top,dom,prompts:row[COL.prompts]});
});

const sgrid=document.getElementById("sgrid");
const cells=[];
RT.days.forEach((row,i)=>{
  const c=el("div","scell",sgrid);c.style.setProperty("--x",i);c.title=`${row[0]}: ${row[COL.prompts]} prompts`;
  const lamp=el("i","lamp",c);lamp.dataset.model=dayCols[i].dom;lamp.style.setProperty("--c",C[dayCols[i].dom]);
  const level=Math.pow(row[COL.prompts]/maxP,0.5);
  lamp.style.setProperty("--b",String(0.35+0.65*level));
  cells.push({c,lamp});
});

document.getElementById("tools").append(...RT.tools.map(t=>{
  const b=el("button","tool");b.type="button";b.setAttribute("aria-label",t.name.replaceAll("_"," "));
  const reds=t.failed?Math.max(1,Math.round(Math.sqrt(t.failed/t.calls)*8)):0;
  b.title=`${t.name}: ${t.calls} calls, ${t.failed} failed`;
  let lamps="";for(let i=0;i<8;i++)lamps+=`<i class="fp${i>=8-reds?" bad":""}"></i>`;
  b.innerHTML=icon(TOOLI[t.name]||"wrench")+`<span class="tnum">${fmt(t.calls)}</span><span class="fmeter">${lamps}</span><span class="tip">${t.name.replaceAll("_"," ")}</span>`;
  return b;
}));

const ha=document.getElementById("ha"),hb=document.getElementById("hb"),band=document.getElementById("band"),track=document.getElementById("track");
function place(){
  ha.style.insetInlineStart=(a/N*100)+"%";
  hb.style.insetInlineStart=((b+1)/N*100)+"%";
  band.style.insetInlineStart=(a/N*100)+"%";
  band.style.inlineSize=((b-a+1)/N*100)+"%";
  ha.setAttribute("aria-valuenow",a);hb.setAttribute("aria-valuenow",b);
  ha.setAttribute("aria-valuetext",RT.days[a][0]);hb.setAttribute("aria-valuetext",RT.days[b][0]);
  document.getElementById("when").textContent=dlab(a)+"–"+dlab(b);
  document.getElementById("wlen").textContent=String(b-a+1);
}
function paint(){
  const total=winTok();
  rows.forEach(r=>{
    if(r.miss){r.b.setAttribute("aria-label",r.id+", no usage reported");return;}
    const part=r.id==="other"?win("otherModelTokens"):winModel(r.id);
    const share=total?part/total:0;
    const n=part>0?Math.max(1,Math.round(share*PIPS)):0;
    r.pips.forEach((p,i)=>p.classList.toggle("on",i<n));
    const label=r.id==="other"?"other":r.id;
    r.pc.textContent=pct(part,total);
    r.b.setAttribute("aria-label",r.id==="other"?"other models, "+pct(part,total):label+", "+pct(part,total)+" of tokens");
    if(r.id!=="other")r.b.title=`${r.id}: ${fmt(part)} tokens`;
    else r.b.title=`other models: ${fmt(part)} tokens`;
  });
  dayCols.forEach((col,i)=>{
    const inside=i>=a&&i<=b;
    col.dots.forEach((d,k)=>{
      const id=col.lit[k];
      d.classList.toggle("on",!!id&&inside);
      d.classList.toggle("ghost",!!id&&!inside);
    });
    const cell=cells[i];
    cell.c.classList.toggle("in",inside);
    cell.lamp.classList.toggle("on",inside);
    cell.lamp.classList.toggle("ghost",!inside);
  });
  place();
}
function setHi(id){if(hi===id)return;hi=id;if(id)document.body.dataset.hi=id;else delete document.body.dataset.hi;document.querySelectorAll("[data-model]").forEach(n=>{const hot=!!id&&n.dataset.model===id;n.classList.toggle("hot",hot);n.classList.toggle("dim",!!id&&!hot);});}
function apply(v){shown.tok=v.tok;shown.prompts=v.prompts;shown.providerTurns=v.providerTurns;shown.threads=v.threads;shown.subAgents=v.subAgents;shown.toolCalls=v.toolCalls;setDigits(tokEl,fmt(v.tok));for(const k of Object.keys(statEls))setDigits(statEls[k],fmt(shown[k]),true);}
function numbers(immediate){
  const target={tok:winTok(),prompts:win("prompts"),providerTurns:win("providerTurns"),threads:win("threads"),subAgents:win("subAgents"),toolCalls:win("toolCalls")};
  pending=target;
  if(immediate||reduce){cancelAnimationFrame(raf);raf=0;apply(target);return;}
  const from={...shown};const t0=performance.now();const dur=booted?180:900;booted=true;
  cancelAnimationFrame(raf);
  const step=now=>{
    if(document.hidden){apply(target);raf=0;return;}
    const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3),cur={};
    for(const k in target)cur[k]=from[k]+(target[k]-from[k])*e;
    apply(cur);
    if(t<1)raf=requestAnimationFrame(step);else raf=0;
  };
  raf=requestAnimationFrame(step);
}
function armWave(){if(reduce)return;document.body.classList.remove("intro");document.body.classList.add("wave");clearTimeout(waveT);waveT=setTimeout(()=>document.body.classList.remove("wave"),680);}
function commit(immediate){if(!immediate)armWave();paint();numbers(immediate);}
function nudge(edge,dir){if(edge==="a")a=Math.max(0,Math.min(b,a+dir));else b=Math.max(a,Math.min(N-1,b+dir));commit(false);}
function onKey(e,edge){
  const k=e.key;let dir=k==="ArrowRight"||k==="ArrowUp"?1:k==="ArrowLeft"||k==="ArrowDown"?-1:0;
  if(k==="Home")dir=edge==="a"?-N:a-b;if(k==="End")dir=edge==="a"?b-a:N;
  if(!dir)return;e.preventDefault();nudge(edge,dir);
}
ha.addEventListener("keydown",e=>onKey(e,"a"));
hb.addEventListener("keydown",e=>onKey(e,"b"));
let drag=null;
function idx(e){const r=track.getBoundingClientRect();const x=Math.min(Math.max(e.clientX-r.left,0),r.width-0.001);return Math.min(N-1,Math.floor(x/r.width*N));}
track.addEventListener("pointerdown",e=>{
  document.body.classList.remove("wave");
  const hit=e.target.closest("[data-edge]");
  const i=idx(e);
  drag=hit?hit.dataset.edge:(Math.abs(i-a)<=Math.abs(i-b)?"a":"b");
  track.setPointerCapture(e.pointerId);
  if(drag==="a")a=Math.min(i,b);else b=Math.max(i,a);
  commit(true);
});
track.addEventListener("pointermove",e=>{if(!drag)return;const i=idx(e);if(drag==="a")a=Math.min(i,b);else b=Math.max(i,a);commit(true);});
track.addEventListener("pointerup",()=>{if(!drag)return;drag=null;armWave();});
track.addEventListener("pointercancel",()=>{drag=null;});

document.addEventListener("visibilitychange",()=>{
  document.documentElement.classList.toggle("away",document.hidden);
  if(document.hidden&&pending){cancelAnimationFrame(raf);raf=0;apply(pending);}
});
paint();
if(reduce){lightHeat();numbers(true);}
else requestAnimationFrame(()=>{lightHeat();numbers(false);});
setTimeout(()=>document.body.classList.remove("intro"),1400);
})();
</script>
</body>
</html>
