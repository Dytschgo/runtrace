<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runtrace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500&family=Hanken+Grotesk:wght@400;500&family=Unbounded:wght@500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; min-width: 0; }
:root {
  --bg: oklch(0.145 0.028 255);
  --surface: oklch(0.2 0.032 255);
  --text: oklch(0.96 0.012 250);
  --muted: oklch(0.82 0.02 250);
  --faint: oklch(0.74 0.025 250);
  --ice: oklch(0.86 0.06 220);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  color-scheme: dark;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; }
body {
  position: relative;
  background:
    radial-gradient(480px 480px at 640px 448px, oklch(0.28 0.045 255 / 0.72), transparent 70%),
    var(--bg);
  color: var(--text);
  font: 400 14px/1.2 "Hanken Grotesk", sans-serif;
}
:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
button { font: inherit; color: inherit; background: transparent; border: 0; padding: 0; cursor: pointer; }
button, [role="slider"] { touch-action: none; user-select: none; }
svg.ico, .brand svg, .stat svg { display: block; flex: none; }

.brand {
  position: absolute;
  inset-block-start: 26px;
  inset-inline-start: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 3;
}
.brand svg { width: 48px; height: 48px; }
.word {
  font: 500 22px/1 "Unbounded", sans-serif;
  letter-spacing: -0.04em;
}
.logo-dot { transform: translate(42.8px, 13.7px); }

nav { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
nav button {
  position: absolute;
  inline-size: 36px;
  block-size: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--muted);
  pointer-events: auto;
}
nav button::after {
  content: "";
  position: absolute;
  inset: min(0px, (100% - 44px) / 2);
}
nav button[aria-current="page"] { color: var(--text); }
.ind {
  position: absolute;
  inline-size: 36px;
  block-size: 36px;
  border: 1.5px solid var(--ice);
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 16px oklch(0.86 0.06 220 / 0.35);
}
.tip {
  position: absolute;
  inset-block-start: calc(100% + 8px);
  inset-inline-start: 50%;
  translate: -50% 0;
  padding: 4px 8px;
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}
button:focus-visible .tip { opacity: 1; }

.range {
  position: absolute;
  inset-block-start: 28px;
  inset-inline-start: 1096px;
  inline-size: 312px;
  z-index: 3;
}
.dates { display: flex; align-items: baseline; gap: 10px; }
.dates b {
  font: 500 28px/1 "Azeret Mono", monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
}
.rule {
  flex: 1;
  block-size: 1px;
  background: oklch(0.8 0.03 230 / 0.45);
}
#dlen {
  font: 500 12px/1 "Azeret Mono", monospace;
  color: var(--faint);
}
.tz { margin-block-start: 8px; font-size: 12px; color: var(--faint); }

#dial {
  position: absolute;
  inset-block-start: 18px;
  inset-inline-start: 210px;
  width: 860px;
  height: 860px;
  z-index: 1;
  pointer-events: none;
}
#dial .hit { cursor: grab; }
#dial path.hit { pointer-events: stroke; }
#dial .handle { pointer-events: visiblePainted; }
.day.off { opacity: 0.14; }
#dial .handle.is-drag { cursor: grabbing; }
.handle .cap { fill: #f4f8fc; stroke: #9fd4ff; stroke-width: 2; }
.handle .halo { fill: #9fd4ff; opacity: 0.18; }
.tick { stroke: oklch(0.78 0.02 240 / 0.55); stroke-width: 1.25; }
.tick.major { stroke: oklch(0.9 0.02 230 / 0.8); }
.hero {
  position: absolute;
  inset-block-start: 408px;
  inset-inline-start: 500px;
  inline-size: 280px;
  text-align: center;
  pointer-events: none;
  z-index: 2;
}
.hero b {
  display: block;
  font: 500 46px/1 "Azeret Mono", monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.05em;
}
.unit {
  display: block;
  margin-block-start: 8px;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--faint);
}

.legend {
  position: absolute;
  inset-block-start: 124px;
  inset-inline-start: 1096px;
  inline-size: 312px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.legend button, .other-row {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 8px;
  align-items: center;
  min-block-size: 38px;
  padding-inline: 8px;
  border-radius: 10px;
  text-align: start;
  color: var(--text);
}
.legend svg { color: var(--c); }
.nm { font-size: 13px; white-space: nowrap; }
.sh {
  font: 500 13px/1 "Azeret Mono", monospace;
  font-variant-numeric: tabular-nums;
  color: var(--c);
}
.swatch {
  inline-size: 22px;
  block-size: 9px;
  border-radius: 2px;
  background: repeating-linear-gradient(135deg, var(--c) 0 1.5px, transparent 1.5px 4.5px);
}
.other-row { cursor: default; }
.other-row .sh { color: #93a0b0; }

.stats {
  position: absolute;
  inset-block-start: 808px;
  inset-inline-start: 430px;
  inline-size: 420px;
  z-index: 3;
  display: flex;
  justify-content: space-between;
}
.stat { display: flex; gap: 6px; align-items: center; color: var(--ice); }
.stat div { color: var(--text); }
.stat b {
  display: block;
  font: 500 18px/1 "Azeret Mono", monospace;
  font-variant-numeric: tabular-nums;
}
.stat span { display: block; margin-block-start: 3px; font-size: 12px; color: var(--muted); }

.heat {
  position: absolute;
  inset-block-start: 742px;
  inset-inline-start: 24px;
  z-index: 3;
}
.tools {
  position: absolute;
  inset-block-start: 628px;
  inset-inline-start: 1096px;
  inline-size: 312px;
  z-index: 3;
}
.cap {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--faint);
}
.mark { letter-spacing: 0.14em; text-transform: uppercase; }
.hgrid, .hours {
  display: grid;
  grid-template-columns: 16px repeat(24, 8px);
  gap: 2px;
}
.hgrid { margin-block-start: 8px; }
.hours {
  margin-block-start: 4px;
  color: var(--faint);
  font: 500 12px/1 "Azeret Mono", monospace;
}
.dl {
  font-size: 12px;
  line-height: 8px;
  color: var(--faint);
  text-align: center;
}
.cell { inline-size: 8px; block-size: 8px; border-radius: 2px; }
.tool {
  display: grid;
  grid-template-columns: 16px 1fr auto auto;
  gap: 8px;
  align-items: center;
  min-block-size: 28px;
  color: var(--muted);
}
.tool .tn { font-size: 12px; color: var(--text); white-space: nowrap; overflow: clip; }
.tool .calls, .tool .fp {
  font: 500 12px/1 "Azeret Mono", monospace;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.tool .fp { color: #ffb0aa; }

html.hot #dial [data-model]:not(.on),
html.hot .legend [data-model]:not(.on),
html.hot .quiet { opacity: 0.16; }

@media (hover: hover) and (pointer: fine) {
  nav button:hover { background: oklch(0.9 0.02 250 / 0.08); color: var(--text); }
  .legend button:hover { background: oklch(0.9 0.02 250 / 0.06); }
  button:hover .tip { opacity: 1; }
}
nav button:active, .legend button:active { transform: scale(0.96); }
.handle.is-drag .cap { transform: scale(1.16); }

@media (prefers-reduced-motion: no-preference) {
  .logo-stroke, .logo-leg {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw 0.8s var(--ease-out) forwards;
  }
  .logo-leg { animation-delay: 0.5s; }
  .logo-dot {
    transform: none;
    offset-path: path("M20 12 A16 16 0 1 1 23.8 38.5");
    offset-rotate: 0deg;
    animation: ride 0.9s var(--ease-out) 0.28s both;
  }
  nav button { animation: rise 0.45s var(--ease-out) both; }
  .hero { animation: rise 0.55s var(--ease-out) 0.1s both; }
  .legend { animation: rise 0.55s var(--ease-out) 0.18s both; }
  .range { animation: rise 0.5s var(--ease-out) 0.08s both; }
  .stats { animation: rise 0.5s var(--ease-out) 0.28s both; }
  .heat { animation: rise 0.5s var(--ease-out) 0.36s both; }
  .tools { animation: rise 0.5s var(--ease-out) 0.42s both; }
  #dial { animation: dial-in 0.9s var(--ease-out) both; }
  .ind {
    transition:
      inset-inline-start 0.32s var(--ease-out),
      inset-block-start 0.32s var(--ease-out);
  }
  nav button, .legend button { transition: transform 0.16s var(--ease-out); }
  .handle .cap { transition: transform 0.16s var(--ease-out); }
  #dial [data-model], #dial .quiet, .legend button, .day { transition: opacity 0.16s var(--ease-out); }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes ride {
  from { offset-distance: 0%; opacity: 0; }
  18% { opacity: 1; }
  to { offset-distance: 32%; opacity: 1; }
}
@keyframes rise { from { opacity: 0; translate: 0 8px; } }
@keyframes dial-in { from { opacity: 0; transform: scale(0.965); } }
</style>

  for (let i = start; i <= end; i++) {
    const row = RT.days[i];
    sums.prompts += row[col.prompts];
    sums.providerTurns += row[col.providerTurns];
    sums.threads += row[col.threads];
    sums.subAgents += row[col.subAgents];
    sums.toolCalls += row[col.toolCalls];
    sums.other += row[col.otherModelTokens];
    for (const m of RT.models) by[m.id] += row[col[m.id]];
  }
  let total = sums.other;
  for (const m of RT.models) total += by[m.id];
  goal.total = total;
  goal.stats = sums;
  goal.shares = { other: total ? sums.other / total : 0 };
  for (const m of RT.models) if (m.tokens != null) goal.shares[m.id] = total ? by[m.id] / total : 0;
  let max = 0;
  goal.days = RT.days.map((row, i) => {
    let t = row[col.otherModelTokens];
    const segs = { other: row[col.otherModelTokens] };
    for (const m of RT.models) {
      if (m.tokens == null) continue;
      segs[m.id] = row[col[m.id]];
      t += row[col[m.id]];
    }
    const inside = i >= start && i <= end;
    if (inside && t > max) max = t;
    return { t, segs, inside };
  });
  goal.max = max || 1;
  dataDirty = true;
  const sH = hStart, eH = hEnd;
  sH.setAttribute('aria-valuenow', String(start));
  eH.setAttribute('aria-valuenow', String(end));
  sH.setAttribute('aria-valuetext', RT.days[start][0]);
  eH.setAttribute('aria-valuetext', RT.days[end][0]);
}
function setBound(which, day) {
  day = Math.max(0, Math.min(34, day));
  if (which === 'start') start = Math.min(day, end);
  else end = Math.max(day, start);
  compute();
}
function setHot(id) {
  hotId = id;
  document.documentElement.classList.toggle('hot', !!id);
  document.querySelectorAll('[data-model]').forEach((n) => n.classList.toggle('on', !!id && n.dataset.model === id));
}

function drawRings() {
  for (const ring of rings) {
    ring.g.setAttribute('transform', `rotate(${(-90 + ring.ang).toFixed(2)} ${CX} ${CY})`);
    const c = 2 * Math.PI * ring.r;
    const share = view.shares[ring.id] || 0;
    const len = share > 0 ? share * c : 0;
    ring.arc.setAttribute('stroke-dasharray', `${len.toFixed(2)} ${(c - len).toFixed(2)}`);
  }
}
function drawData() {
  const [a0, a1] = [ARC0 + start * SL, ARC0 + (end + 1) * SL];
  const d = arcPath(348, a0, a1);
  winArc.setAttribute('d', d);
  winGlow.setAttribute('d', d);
  hit.setAttribute('d', arcPath(348, ARC0, ARC0 + SWEEP));
  placeHandle(hStart, dayAng(start));
  placeHandle(hEnd, dayAng(end));
  let html = '';
  for (let i = 0; i < N; i++) {
    const day = goal.days[i];
    const reach = 268 + (322 - 268) * dayNow[i];
    const a = ARC0 + i * SL + 0.4;
    const b = ARC0 + (i + 1) * SL - 0.4;
    let r = 268;
    let parts = '';
    if (day.t > 0 && reach > 269) {
      for (const id of SEG) {
        const v = day.segs[id] || 0;
        if (v <= 0) continue;
        const r2 = r + (reach - 268) * (v / day.t);
        const attr = id === 'other' ? 'class="quiet"' : `data-model="${id}"`;
        parts += `<path ${attr} d="${wedge(r, r2, a, b)}" fill="${COLOR[id]}"/>`;
        r = r2;
      }
    }
    html += `<g class="day${day.inside ? '' : ' off'}">${parts}</g>`;
  }
  daysG.innerHTML = html;
  document.getElementById('tok').textContent = fmt(view.total);
  for (const key of Object.keys(statEl)) statEl[key].textContent = fmt(view.stats[key] || 0);
  for (const id of ORDER) {
    if (missing.has(id) || id === 'other') {
      if (id === 'other') legendRow.other.querySelector('.sh').textContent = pct(view.shares.other || 0);
      continue;
    }
    const text = pct(view.shares[id] || 0);
    legendRow[id].querySelector('.sh').textContent = text;
    const exact = goal.shares[id] != null ? fmt(goal.total * (goal.shares[id] || 0)) : '';
    legendRow[id].title = id + ' · ' + exact + ' tokens';
  }
  document.getElementById('d0').textContent = stamp(RT.days[start][0]);
  document.getElementById('d1').textContent = stamp(RT.days[end][0]);
  document.getElementById('dlen').textContent = (end - start + 1) + 'd';
  if (hotId) setHot(hotId);
}
function placeHandle(node, deg) {
  const [x, y] = polar(348, deg);
  node.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
}
function snapView() {
  view.total = goal.total;
  for (const k in statEl) view.stats[k] = goal.stats[k];
  for (const id of ORDER) if (!missing.has(id)) view.shares[id] = goal.shares[id] || 0;
  for (let i = 0; i < N; i++) dayNow[i] = Math.min(1, goal.days[i].t / goal.max);
}
function easeView(dt) {
  const k = 1 - Math.exp(-dt / 0.12);
  const step = (a, b) => a + (b - a) * k;
  view.total = step(view.total, goal.total);
  for (const key in statEl) view.stats[key] = step(view.stats[key] || 0, goal.stats[key] || 0);
  for (const id of ORDER) if (!missing.has(id)) view.shares[id] = step(view.shares[id] || 0, goal.shares[id] || 0);
  for (let i = 0; i < N; i++) dayNow[i] = step(dayNow[i], Math.min(1, goal.days[i].t / goal.max));
  const done = Math.abs(view.total - goal.total) <= Math.max(1, goal.total * 0.002) && dayNow.every((v, i) => Math.abs(v - Math.min(1, goal.days[i].t / goal.max)) < 0.002);
  if (done) {
    snapView();
    drawData();
    dataDirty = false;
  }
}

let loopOn = false, raf = 0, lastT = 0;
function tick(t) {
  if (!loopOn) return;
  const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0.016;
  lastT = t;
  for (const ring of rings) ring.ang += (SPIN[ring.id] || 0) * dt;
  if (dragging || reduced) snapView();
  else if (dataDirty) easeView(dt);
  drawRings();
  if (dataDirty || dragging) drawData();
  raf = requestAnimationFrame(tick);
}
function startLoop() {
  if (loopOn || reduced || document.hidden) return;
  loopOn = true;
  lastT = 0;
  raf = requestAnimationFrame(tick);
}
function stopLoop() {
  loopOn = false;
  cancelAnimationFrame(raf);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop();
  else startLoop();
});

function eventDeg(ev) {
  const pt = dial.createSVGPoint();
  pt.x = ev.clientX;
  pt.y = ev.clientY;
  const p = pt.matrixTransform(dial.getScreenCTM().inverse());
  let d = Math.atan2(p.y - CY, p.x - CX) * 180 / Math.PI;
  if (d < 0) d += 360;
  return d;
}
function dayFromDeg(d) {
  let x = (d - ARC0 + 360) % 360;
  if (x > SWEEP) return (360 - x) < (x - SWEEP) ? 0 : 34;
  return Math.max(0, Math.min(34, Math.round(x / SL - 0.5)));
}
function onDown(ev) {
  active = ev.currentTarget.dataset.which || nearest(eventDeg(ev));
  dragging = true;
  ev.currentTarget.classList.add('is-drag');
  ev.currentTarget.setPointerCapture(ev.pointerId);
  setBound(active, dayFromDeg(eventDeg(ev)));
  if (reduced) { snapView(); drawRings(); drawData(); }
}
hit.addEventListener('pointerdown', onDown);
function nearest(d) {
  const day = dayFromDeg(d);
  return Math.abs(day - start) <= Math.abs(day - end) ? 'start' : 'end';
}
window.addEventListener('pointermove', (ev) => {
  if (!dragging) return;
  setBound(active, dayFromDeg(eventDeg(ev)));
  if (reduced) { snapView(); drawRings(); drawData(); }
});
window.addEventListener('pointerup', () => {
  dragging = false;
  hStart.classList.remove('is-drag');
  hEnd.classList.remove('is-drag');
});
function onKey(ev) {
  const which = ev.currentTarget.dataset.which;
  let delta = 0;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') delta = 1;
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') delta = -1;
  else if (ev.key === 'PageUp') delta = 7;
  else if (ev.key === 'PageDown') delta = -7;
  else if (ev.key === 'Home') delta = which === 'start' ? -34 : start - end;
  else if (ev.key === 'End') delta = which === 'start' ? end - start : 34;
  else return;
  ev.preventDefault();
  const cur = which === 'start' ? start : end;
  setBound(which, cur + delta);
  if (reduced) { snapView(); drawRings(); drawData(); }
  else { dataDirty = true; startLoop(); }
}

compute();
if (reduced) {
  snapView();
  drawRings();
  drawData();
} else startLoop();
</script>
</body>
</html>
