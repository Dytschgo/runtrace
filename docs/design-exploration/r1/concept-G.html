function recompute(){const rows=RT.days.slice(start,end+1),sum=k=>rows.reduce((a,r)=>a+r[columns[k]],0);targets={total:sum('otherModelTokens')+RT.models.reduce((a,m)=>a+sum(m.id),0)};statDefs.forEach(([k])=>targets['s-'+k]=sum(k));RT.models.forEach((m,i)=>{if(m.tokens===null)return;const share=targets.total?sum(m.id)/targets.total*100:0;const e=$('.tape-model[data-model="'+m.id+'"]');e.style.setProperty('--share',Math.min(share/100,.98));e.querySelector('.share').textContent=(share>0&&share<.1?'<0.1':share.toFixed(1))+'%';e.setAttribute('aria-label',m.id+', '+share.toFixed(2)+' percent');e.title=m.id+' · '+sum(m.id).toLocaleString()+' tokens · '+share.toFixed(2)+'%'});handles.forEach((h,i)=>{const v=i?end:start;h.style.insetInlineStart=v/34*100+'%';h.setAttribute('aria-valuenow',v);h.setAttribute('aria-valuetext',RT.days[v][0]);h.setAttribute('aria-valuemin',i?start:0);h.setAttribute('aria-valuemax',i?34:end);h.querySelector('output').textContent=shortDate(v);h.querySelector('output').style.insetBlockEnd=(start===end&&i?66:43)+'px';h.querySelector('output').style.transform=v<3?'translateX(-15%)':v>31?'translateX(-85%)':'translateX(-50%)'});$('.window').style.insetInlineStart=start/34*100+'%';$('.window').style.inlineSize=(end-start)/34*100+'%';$('#duration').textContent=(end-start+1)+(end===start?' DAY':' DAYS');$('#duration').style.opacity=end>28&&end-start<5?0:1;$('#dates').textContent=RT.days[start][0]+' — '+RT.days[end][0];const max=Math.max(...rows.map(r=>RT.models.reduce((a,m)=>a+r[columns[m.id]],r[columns.otherModelTokens])));scale=Math.ceil(max/5e8)*5e8||1;series=RT.models.filter(m=>m.tokens!==null).map(m=>RT.days.map((r,i)=>i<start||i>end?0:r[columns[m.id]]/scale));if(!$('#chart').children.length){$('#chart').innerHTML='<g id="grid"></g><g id="curves"></g><g id="other"></g><path id="reticle" class="ambient" d="M48 25V164"/><path d="M837 18h10m-5-5v10" stroke="#8bddff" fill="none"/>';$('#curves').innerHTML=RT.models.filter(m=>m.tokens!==null).map((m,i)=>'<g
