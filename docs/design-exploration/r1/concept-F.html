const head = `<span class="${m.tokens == null ? "plate" : "hd"}"><span class="ic">${icon(m.icon)}</span><span class="nm">${NAME[m.id]}</span></span>`;
btn.innerHTML = `<span class="inn">${head}${m.tokens == null ? "" : `<span class="ft"><span class="num"></span><span class="pc"></span></span>`}</span>`;
map.append(btn);
tileEls.set(m.id, btn);
}
const ribbon = document.getElementById("ribbon");
for (const id of order) {
const i = document.createElement("i");
i.dataset.model = id;
i.style.background = COL[id];
ribbon.append(i);
}
const o = document.createElement("i");
o.style.background = "var(--other)";
o.dataset.tip = "Other models";
ribbon.append(o);
const flat = RT.heatmap.prompts.flat();
const heatMax = Math.max(...flat);
const heat = document.getElementById("heat");
RT.heatmap.rows.forEach((row, r) => {
const lab = document.createElement("b");
lab.textContent = row[0];
heat.append(lab);
for (let c = 0; c < 24; c++) {
const v = RT.heatmap.prompts[r][c];
const cell = document.createElement("i");
const t = v === 0 ? 0.04 : 0.12 + Math.sqrt(v / heatMax) * 0.88;
cell.style.background = `color-mix(in oklch, var(--sol) ${Math.round(t * 100)}%, var(--surf))`;
cell.dataset.tip = row + " " + String(c).padStart(2, "0") + ":00 · " + v;
heat.append(cell);
}
});
const tools = document.getElementById("tools");
const maxCalls = RT.tools[0].calls;
for (const tool of RT.tools) {
const [label, glyph] = TOOLN[tool.name];
const li = document.createElement("li");
const fp = tool.failed / tool.calls * 100;
const fpText = (fp >= 10 ? fp.toFixed(0) : fp.toFixed(1)) + "%";
li.innerHTML = `<span class="vol" style="--v:${tool.calls / maxCalls}"></span><span class="ic">${icon(glyph)}</span><span class="wn">${label}</span><span class="tn">${compact(tool.calls)}</span><span class="fp">${fpText}</span>`;
li.dataset.tip = tool.name.replaceAll("_", " ").replaceAll(".", " ") + " · " + tool.calls + " calls · failure share " + fpText;
li.setAttribute("aria-label", li.dataset.tip);
tools.append(li);
}
}
function placeThumbs() {
const pad = 22;
const h0 = chips._h0, h1 = chips._h1;
h0.style.insetInlineStart = `calc(${pad}px + ${a / N} * (100% - ${pad * 2}px))`;
h1.style.insetInlineStart = `calc(${pad}px + ${(b + 1) / N} * (100% - ${pad * 2}px))`;
h0.setAttribute("aria-valuenow", String(a));
h1.setAttribute("aria-valuenow", String(b));
h0.setAttribute("aria-valuetext", RT.days[a][ix.date]);
h1.setAttribute("aria-valuetext", RT.days[b][ix.date]);
}
function render(snap) {
const s = totals();
const animate = !snap && !reduced;
setFlap(hero, compact(s.total), animate);
[s.prompts, s.turns, s.threads, s.agents, s.tools].forEach((n, i) => setFlap(statEls[i], compact(n), animate));
document.getElementById("d0").textContent = stamp(a);
document.getElementById("d1").textContent = stamp(b);
[...chips.children].forEach((chip, i) => {
if (!chip.classList.contains("chip")) return;
chip.classList.toggle("in", i >= a && i <= b);
});
const ribbon = document.getElementById("ribbon");
order.forEach((id, i) => {
ribbon.children[i].style.flexGrow = String(Math.max(s.by[id], 0));
ribbon.children[i].style.flexBasis = s.by[id] ? "0" : "0";
ribbon.children[i].style.display = s.by[id] ? "block" : "none";
});
ribbon.lastElementChild.style.flexGrow = String(Math.max(s.other, 0));
ribbon.lastElementChild.style.display = s.other ? "block" : "none";
for (const m of measured) {
const el = tileEls.get(m.id);
const num = el.querySelector(".num");
const pc = el.querySelector(".pc");
const value = s.by[m.id];
setFlap(num, compact(value), animate);
pc.textContent = pct(value, s.total);
el.dataset.tip = m.id + " · " + compact(value) + " · " + pc.textContent;
el.setAttribute("aria-label", el.dataset.tip);
}
for (const m of missing) {
const el = tileEls.get(m.id);
el.dataset.tip = m.id + " · No usage reported";
el.setAttribute("aria-label", el.dataset.tip);
}
const ranked = order.map((id) => ({
id,
wt: Math.max(Math.pow(s.modelSum > 0 ? s.by[id] / s.modelSum : 0, 0.42), 0.05)
})).sort((p, q) => q.wt - p.wt || order.indexOf(p.id) - order.indexOf(q.id));
const rects = layout(map.clientWidth, map.clientHeight, ranked);
for (const rect of rects) track(tileEls.get(rect.id), rect, snap);
placeThumbs();
}
function moveInd() {
const cur = nav.querySelector("[aria-current='page']");
const ind = nav.querySelector(".ind");
const nr = nav.getBoundingClientRect();
const br = cur.getBoundingClientRect();
ind.style.insetInlineStart = (br.left - nr.left) + "px";
ind.style.insetBlockStart = (br.top - nr.top) + "px";
ind.style.inlineSize = br.width + "px";
ind.style.blockSize = br.height + "px";
}
function posFromEvent(e) {
const r = chips.getBoundingClientRect();
const pad = 22;
const t = (e.clientX - r.left - pad) / (r.width - pad * 2);
return Math.min(1, Math.max(0, t)) * N;
}
function moveDrag(pos) {
const day = Math.min(N - 1, Math.max(0, Math.floor(Math.min(pos, N - 0.0001))));
if (drag === "start") {
const next = Math.min(day, b);
if (next !== a) { a = next; render(false); }
} else {
const next = Math.max(day, a);
if (next !== b) { b = next; render(false); }
}
}
chips.addEventListener("pointerdown", (e) => {
if (e.button !== 0) return;
const thumb = e.target.closest(".thumb");
const pos = posFromEvent(e);
drag = thumb ? (thumb.dataset.end ? "end" : "start") : (Math.abs(pos - a) <= Math.abs(pos - (b + 1)) ? "start" : "end");
if (thumb) thumb.focus();
moveDrag(pos);
chips.setPointerCapture(e.pointerId);
});
chips.addEventListener("pointermove", (e) => { if (drag) moveDrag(posFromEvent(e)); });
chips.addEventListener("pointerup", () => { drag = null; });
chips.addEventListener("pointercancel", () => { drag = null; });
chips.addEventListener("keydown", (e) => {
const el = e.target.closest(".thumb");
if (!el) return;
const end = !!el.dataset.end;
let d = 0;
if (e.key === "ArrowRight" || e.key === "ArrowUp") d = 1;
else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = -1;
else if (e.key === "Home") d = -99;
else if (e.key === "End") d = 99;
else return;
e.preventDefault();
if (end) b = Math.max(a, Math.min(N - 1, d === 99 ? N - 1 : d === -99 ? a : b + d));
else a = Math.max(0, Math.min(b, d === -99 ? 0 : d === 99 ? b : a + d));
render(false);
});
function syncHot(e) {
const hover = e?.target?.closest?.("[data-model]");
const focus = document.activeElement?.closest?.("[data-model]");
const id = hover?.dataset.model || focus?.dataset.model || "";
if (id) document.body.dataset.hot = id;
else delete document.body.dataset.hot;
document.querySelectorAll("[data-model]").forEach((el) => {
el.classList.toggle("dim", !!id && el.dataset.model !== id);
});
}
document.body.addEventListener("pointerover", syncHot);
document.body.addEventListener("focusin", syncHot);
document.body.addEventListener("focusout", () => { requestAnimationFrame(() => syncHot()); });
document.body.addEventListener("pointerout", (e) => {
if (!e.relatedTarget || !e.relatedTarget.closest?.("[data-model]")) syncHot({ target: document.body });
});
function showTip(el) {
const text = el?.dataset?.tip;
if (!text) { tip.hidden = true; tip.textContent = ""; return; }
tip.hidden = false;
tip.textContent = text;
const r = el.getBoundingClientRect();
const tw = tip.offsetWidth, th = tip.offsetHeight;
let x = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, 1440 - tw - 8));
let y = r.top - th - 8;
if (y < 8) y = Math.min(r.bottom + 8, 900 - th - 8);
tip.style.insetInlineStart = x + "px";
tip.style.insetBlockStart = y + "px";
}
document.body.addEventListener("pointerover", (e) => {
const el = e.target.closest?.("[data-tip]");
if (el) showTip(el);
});
document.body.addEventListener("pointerout", (e) => {
if (!e.relatedTarget?.closest?.("[data-tip]")) { tip.hidden = true; tip.textContent = ""; }
});
document.body.addEventListener("focusin", (e) => {
const el = e.target.closest?.("[data-tip]");
if (el) showTip(el);
});
document.body.addEventListener("focusout", () => { tip.hidden = true; tip.textContent = ""; });
document.addEventListener("visibilitychange", () => {
if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; }
else kick();
});
build();
render(true);
moveInd();
if (!reduced) {
const steps = 7;
const final = totals();
const targets = [final.total, final.prompts, final.turns, final.threads, final.agents, final.tools];
const els = [hero, ...statEls];
const tileNums = measured.map((m) => [tileEls.get(m.id).querySelector(".num"), final.by[m.id]]);
let step = 0;
const tick = () => {
step++;
const u = 1 - Math.pow(1 - step / steps, 3);
els.forEach((el, i) => setFlap(el, compact(targets[i] * u), true));
tileNums.forEach(([el, n]) => setFlap(el, compact(n * u), true));
if (step < steps) setTimeout(tick, 90);
};
setTimeout(tick, 280);
kick();
}
</script>
