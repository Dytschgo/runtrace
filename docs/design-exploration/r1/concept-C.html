function update(initial=false){let rows=RT.days.slice(lo,hi+1),sum=k=>rows.reduce((a,d)=>a+d[ix[k]],0),total=sum('otherModelTokens')+RT.models.reduce((a,m)=>a+sum(m.id),0);count($('#total'),total,initial);count($('#other'),sum('otherModelTokens'),initial);stats.forEach(([k])=>count($('#stat-'+k),sum(k),initial));$('#windowDays').innerHTML=icon('calendar-days')+(hi-lo+1)+' days';$('#range').textContent=date(lo)+' — '+date(hi);$('#firstDate').textContent=date(0);$('#lastDate').textContent=date(34);$('#plotAxis').innerHTML='<span>'+date(lo)+'</span><span>Daily tokens</span><span>'+date(hi)+'</span>';RT.models.forEach((m,i)=>{if(m.tokens===null)return;let share=total?sum(m.id)/total:0,el=$('.model[data-model="'+m.id+'"]');el.querySelector('.share').textContent=(share>0&&share<.001?'<0.1':(share*100).toFixed(1))+'%';let liquid=el.querySelector('.liquid');liquid.style.setProperty('--share',share);if(!reduced.matches&&!initial){liquid.classList.add('slosh');liquid.onanimationend=()=>liquid.classList.remove('slosh')}let pool=$('.pool[data-model="'+m.id+'"]');pool.style.setProperty('--weight',share*1.35)});let max=Math.max(...segments.slice(lo,hi+1).map(s=>s.total));segments.forEach((s,j)=>{s.el.style.display=j<lo||j>hi?'none':'flex';s.segs.forEach(o=>o.el.style.setProperty('--h',(max?o.v/max*100:0)+'%'))});$('#start').style.insetInlineStart=lo/34*100+'%';$('#end').style.insetInlineStart=hi/34*100+'%';$('#selection').style.insetInlineStart=lo/34*100+'%';$('#selection').style.inlineSize=(hi-lo)/34*100+'%';[['start',lo],['end',hi]].forEach(([id,n])=>{$('#'+id).setAttribute('aria-valuenow',n);$('#'+id).setAttribute('aria-valuetext',date(n))})}
let drag=null;function setHandle(id,n){n=Math.max(0,Math.min(34,n));if(id==='start')lo=Math.min(n,hi);else hi=Math.max(n,lo);update()}document.querySelectorAll('.bead').forEach(b=>{b.onkeydown=e=>{let n=b.id==='start'?lo:hi,step=e.shiftKey?7:1;if(['ArrowRight','ArrowUp','ArrowLeft','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();setHandle(b.id,e.key==='Home'?0:e.key==='End'?34:n+(['ArrowRight','ArrowUp'].includes(e.key)?step:-step))}};b.onpointerdown=e=>{e.preventDefault();drag=b.id;b.focus();$('#slider').setPointerCapture(e.pointerId)}});$('#slider').onpointerdown=e=>{if(e.target.closest('.bead'))return;const r=$('#slider').getBoundingClientRect(),n=Math.round((e.clientX-r.x)/r.width*34);drag=Math.abs(n-lo)<=Math.abs(n-hi)?'start':'end';$('#'+drag).focus();$('#slider').setPointerCapture(e.pointerId);setHandle(drag,n)};$('#slider').onpointermove=e=>{if(!drag)return;const r=$('#slider').getBoundingClientRect();setHandle(drag,Math.round((e.clientX-r.x)/r.width*34))};$('#slider').onpointerup=()=>drag=null;$('#slider').onpointercancel=()=>drag=null;update(true);
