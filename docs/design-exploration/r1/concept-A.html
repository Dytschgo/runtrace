const col=k=>RT.dayColumns.indexOf(k),sum=(a,k)=>a.reduce((s,d)=>s+d[col(k)],0),token=d=>d.slice(6).reduce((a,b)=>a+b,0),full=RT.days.reduce((s,d)=>s+token(d),0);
