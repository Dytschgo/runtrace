function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function gen(seed=7,scale=1){const r=rng(seed),raw=[];
  for(let i=0;i<BINS;i++){const x=(i-27)/11,base=Math.exp(-x*x)+.05;raw.push(MODELS.map(m=>base*m.w*(.55+r()*.9)))}
  MODELS.forEach((m,j)=>{let s=0;for(let i=12;i<42;i++)s+=raw[i][j];const t=m.w*1.28e6*scale/s;raw.forEach(b=>b[j]*=t)});
  DATA=raw.map(b=>({gpt:b[0],cla:b[1],gem:b[2]}))}
gen();
const val=(b,k)=>OFF.has(k)?0:b[k];
const binTot=b=>val(b,'gpt')+val(b,'cla')+val(b,'gem');
function sum(a=R.a,b=R.b){const o={gpt:0,cla:0,gem:0};for(let i=a;i<b;i++)for(const k in o)o[k]+=val(DATA[i],k);
  o.total=o.gpt+o.cla+o.gem;const s=o.s=o.total/1.28e6;o.runs=Math.round(24*s);o.tools=Math.round(342*s);o.agents=Math.round(18*s);
  o.read=Math.round(148*s);o.edit=Math.round(96*s);o.shell=Math.max(0,o.tools-o.read-o.edit);return o}
function fmt(n){n=Math.round(n);if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e4)return Math.round(n/1e3)+'K';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return''+n}
const int=n=>''+Math.round(n);
const tm=i=>{const m=540+i*10;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur=()=>{const m=(R.b-R.a)*10;return(m/60|0)+'h '+String(m%60).padStart(2,'0')+'m'};
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tween(el,to,f=fmt){if(!el)return;const from=el._v??0;el._v=to;cancelAnimationFrame(el._r);
  if(still||from===to){el.textContent=f(to);return}const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/450),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e);if(p<1)el._r=requestAnimationFrame(step)};el._r=requestAnimationFrame(step)}
function bindRange(track,ha,hb,cb){
  const clamp=w=>{if(w==='a')R.a=Math.max(0,Math.min(R.a,R.b-3));else R.b=Math.min(BINS,Math.max(R.b,R.a+3))};
  [[ha,'a'],[hb,'b']].forEach(([h,w])=>{h.classList.add('hd');h.tabIndex=0;h.setAttribute('role','slider');h.setAttribute('aria-label',w==='a'?'Range start':'Range end');
    h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);h.classList.add('drag');e.preventDefault();h.focus()});
    h.addEventListener('pointermove',e=>{if(!h.hasPointerCapture(e.pointerId))return;const r=track.getBoundingClientRect();
      R[w]=Math.max(0,Math.min(BINS,Math.round((e.clientX-r.left)/r.width*BINS)));clamp(w);cb()});
    h.addEventListener('pointerup',()=>h.classList.remove('drag'));
    h.addEventListener('keydown',e=>{const d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;if(d){e.preventDefault();R[w]+=d;clamp(w);cb()}})})}
function place(el){el.style.left=R.a/BINS*100+'%';el.style.right=(1-R.b/BINS)*100+'%'}
const tipEl=document.createElement('div');tipEl.id='tip';document.body.append(tipEl);
function tip(e,html){tipEl.innerHTML=html;tipEl.classList.add('on');const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tipEl.style.left=x+'px';tipEl.style.top=y+'px'}
function untip(){tipEl.classList.remove('on')}
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const binTip=n=>`<b>${tm(n)}</b>`+MODELS.map(m=>`<br><i class="${m.k}"></i>${m.name} ${fmt(DATA[n][m.k])}`).join('');
function histo(box,stacked){box.classList.add('histo');box.innerHTML=DATA.map((_,i)=>`<i style="--d:${i}">${stacked?'<b class="gem"></b><b class="cla"></b><b class="gpt"></b>':''}</i>`).join('');
  box.addEventListener('pointermove',e=>{const i=e.target.closest('.histo>i');if(!i)return untip();tip(e,binTip([...box.children].indexOf(i)))});
  box.addEventListener('pointerleave',untip)}
function paintHisto(box){const mx=Math.max(...DATA.map(b=>b.gpt+b.cla+b.gem));[...box.children].forEach((el,i)=>{
  el.style.height=Math.max(1.5,binTot(DATA[i])/mx*100)+'%';el.classList.toggle('in',i>=R.a&&i<R.b);
  ['gem','cla','gpt'].forEach((k,j)=>{if(el.children[j])el.children[j].style.flex=val(DATA[i],k)||0})})}
function ticks(el){el.classList.add('ticks');el.innerHTML=Array.from({length:10},(_,i)=>`<span style="left:${i/9*100}%">${String(9+i).padStart(2,'0')}:00</span>`).join('')}
function nice(mx){const st=[5e3,1e4,2e4,2.5e4,5e4,1e5,2e5,2.5e5,5e5].find(s=>mx/s<=4.5)||1e6;return{st,top:Math.ceil(mx/st)*st}}
function curve(p){let d=`M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;for(let i=1;i<p.length;i++){const m=((p[i-1][0]+p[i][0])/2).toFixed(1);d+=`C${m} ${p[i-1][1].toFixed(1)} ${m} ${p[i][1].toFixed(1)} ${p[i][0].toFixed(1)} ${p[i][1].toFixed(1)}`}return d}
const smooth=a=>a.map((v,i)=>(v*2+(a[i-1]??v)+(a[i+1]??v))/4);
function toggles(sel,cb){$$(sel).forEach(b=>{b.setAttribute('aria-pressed','true');b.addEventListener('click',()=>{const k=b.dataset.m;
  if(OFF.has(k))OFF.delete(k);else if(OFF.size<2)OFF.add(k);$$(sel).forEach(x=>x.setAttribute('aria-pressed',String(!OFF.has(x.dataset.m))));cb()})})}
function navs(sel){$$(sel).forEach(b=>b.addEventListener('click',()=>{$$(sel).forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page')}))}

const DAYS=[['Nov 4',41,.72],['Nov 5',23,1.12],['Nov 6',7,1],['Nov 7',88,.86],['Nov 8',5,1.21]];let day=2;
const RING=[['gpt',250,36],['cla',196,28],['gem',152,22]];
const pol=(r,d)=>{const t=(d-90)*Math.PI/180;return[300+r*Math.cos(t),300+r*Math.sin(t)]};
const arc=(r,a0,a1)=>{const[x0,y0]=pol(r,a0),[x1,y1]=pol(r,a1);return`M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`};
let s='';RING.forEach(([k,r,w])=>{s+=`<circle cx="300" cy="300" r="${r}" fill="none" stroke="#f0eeeb" stroke-width="${w}"/>`;
 for(let i=0;i<72;i++)s+=`<path class="seg" data-k="${k}" data-i="${i}" d="${arc(r,270+i*5+.5,275+i*5-.5)}" stroke="${i<BINS?`var(--${k})`:'#e4e1dd'}" stroke-width="${w}" style="--d:${i};--w:${w}px"/>`});
[['09',270],['12',0],['15',90],['18',180]].forEach(([t,d])=>{const[x,y]=pol(303,d),[a,b]=pol(275,d),[c,e]=pol(288,d);s+=`<text x="${x.toFixed(0)}" y="${y.toFixed(0)}">${t}</text><path d="M${a} ${b}L${c} ${e}" stroke="#141414" stroke-width="3"/>`});
s+=`<path id="rarc"/><path id="hand" d="M300 172V20"/>`;$('#svg').innerHTML=s;
$('#svg').addEventListener('pointermove',e=>{const g=e.target.closest('.seg');if(!g||+g.dataset.i>=BINS)return untip();const i=+g.dataset.i,k=g.dataset.k;tip(e,`<b>${tm(i)}</b><br><i class="${k}"></i>${MN[k]} ${fmt(DATA[i][k])}`)});
$('#svg').addEventListener('pointerleave',untip);
$('#tree').innerHTML=[['research',6,['collect',3],['analyze',3]],['build',8,['plan',4],['implement',4]],['review',4,['lint',2],['verify',2]]].map((g,j)=>
 `<details ${j<2?'open':''}><summary>${ic('branch')}${g[0]} (${g[1]})</summary><ul>${g.slice(2).map((c,i)=>`<li style="--i:${i}">${ic('branch')}${c[0]} (${c[1]})</li>`).join('')}</ul></details>`).join('');
histo($('#h'));
function update(){const t=sum();place($('#sel'));paintHisto($('#h'));$('#rl').textContent=tm(R.a)+' – '+tm(R.b);
 tween($('#sRuns'),t.runs,int);tween($('#sTok'),t.total);tween($('#sAg'),t.agents,int);tween($('#tR'),t.read,int);tween($('#tE'),t.edit,int);tween($('#tS'),t.shell,int);
 MODELS.forEach(m=>tween($('#v-'+m.k),t[m.k]));
 const mx={};MODELS.forEach(m=>mx[m.k]=Math.max(...DATA.map(b=>b[m.k])));
 $$('.seg').forEach(g=>{const i=+g.dataset.i,k=g.dataset.k;if(i>=BINS){g.style.opacity=.5;return}
  const v=OFF.has(k)?0:Math.pow(DATA[i][k]/mx[k],.85),inr=i>=R.a&&i<R.b;g.style.opacity=inr?.14+.86*v:.1+.3*v});
 $('#rarc').setAttribute('d',arc(279,270+R.a*5,270+R.b*5));$('#hand').style.transform=`rotate(${270+R.b*5}deg)`}
let playing=false,endB=0;const pb=$('#play');
function stop(){playing=false;$('#dialc').classList.remove('playing');pb.innerHTML=ic('play','f')}
pb.onclick=()=>{if(playing)return stop();playing=true;endB=R.b;const a=R.a,t0=performance.now(),T=Math.max(1800,(endB-a)*110);$('#dialc').classList.add('playing');pb.innerHTML=ic('pause');
 (function step(t){if(!playing)return;const p=Math.min(1,(t-t0)/T),nb=Math.max(a+3,Math.round(a+(endB-a)*p));if(nb!==R.b){R.b=nb;update()}p<1?requestAnimationFrame(step):stop()})(t0)};
$('#zo').onclick=()=>{R.a=Math.max(0,R.a-3);R.b=Math.min(BINS,R.b+3);update()};
$('#zi').onclick=()=>{if(R.b-R.a>9){R.a+=3;R.b-=3;update()}};
function setDay(d){day=d;const[n,sd,sc]=DAYS[d];gen(sd,sc);$('#date').textContent=n;$('#prev').disabled=d===0;$('#next').disabled=d===DAYS.length-1;update()}
$('#prev').onclick=()=>setDay(day-1);$('#next').onclick=()=>setDay(day+1);
$$('.rec button').forEach(b=>b.onclick=()=>{const c=+b.dataset.t;R.a=Math.max(0,c-6);R.b=Math.min(BINS,c+6);update()});
bindRange($('#h'),$('#ha'),$('#hb'),update);toggles('.lg button',update);navs('.rail button');
setDay(2);
</script></body></html>
